apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "store-factory.name" . }}
  labels:
    {{- include "store-factory.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "store-factory.name" . }}
  labels:
    {{- include "store-factory.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "persistentvolumeclaims", "resourcequotas", "limitranges", "pods", "pods/log"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "statefulsets/status", "deployments", "deployments/status"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "store-factory.name" . }}
  labels:
    {{- include "store-factory.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "store-factory.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "store-factory.name" . }}
    namespace: {{ .Release.Namespace }}
